<svg width="220" height="220" viewBox="0 0 220 220" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景 -->
  <rect width="100%" height="100%" fill="white"></rect>

  <g stroke="black" stroke-width="3" fill="none" stroke-linecap="round">
    
    <!-- 上 -->
    <path d="M110 40 
             C130 60,130 90,110 110
             C90 90,90 60,110 40"></path>

    <!-- 下 -->
    <path d="M110 180 
             C90 160,90 130,110 110
             C130 130,130 160,110 180"></path>

    <!-- 左 -->
    <path d="M40 110
             C60 90,90 90,110 110
             C90 130,60 130,40 110"></path>

    <!-- 右 -->
    <path d="M180 110
             C160 130,130 130,110 110
             C130 90,160 90,180 110"></path>
  </g>

  <!-- 中心点 -->
  <circle cx="110" cy="110" r="4" fill="black"></circle>
</svg>